# Prueft bei jedem Hochladen den Lua-Code (luacheck, Einstellungen in .luacheckrc).
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: luacheck installieren
        run: sudo apt-get update && sudo apt-get install -y lua-check lua5.1
      - name: Lua-Code pruefen
        run: luacheck . --no-color
      - name: Tests (Sicherheitsregeln, Ausweis, DKP, Sicherung)
        run: lua5.1 tests/run.lua
